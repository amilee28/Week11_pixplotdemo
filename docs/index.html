<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixPlot Viewer Index</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f5;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }
    main {
      width: min(680px, 90vw);
      padding: 40px;
      background: #fff;
      border: 1px solid #e2e2de;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.05);
    }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #666; line-height: 1.6; margin: 0 0 28px; }
    a.card {
      display: block;
      padding: 18px 20px;
      margin-bottom: 14px;
      border: 1px solid #e2e2de;
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      transition: border-color .15s, transform .15s;
    }
    a.card:hover { border-color: #4a7c59; transform: translateY(-2px); }
    a.card strong { display: block; font-size: 17px; margin-bottom: 6px; }
    a.card span { color: #777; font-size: 13px; }
    code { background: #f2f2ef; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>PixPlot viewers</h1>
    <p>Two visual-similarity plots. Clusters group images by Inception features; they are not subject labels.</p>

    <a class="card" href="B24/">
      <strong>B24 &mdash; 29 photos</strong>
      <span>Open viewer <code>/B24/</code></span>
    </a>

    <a class="card" href="B21B24/">
      <strong>B21 + B24 &mdash; 66 photos</strong>
      <span>Open viewer <code>/B21B24/</code></span>
    </a>
  </main>
</body>
</html>
